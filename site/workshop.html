<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop · Stride</title>
  <meta name="description" content="Themes, snippets and tools for the Stride editor. Every extension is reviewed before it is published.">
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/workshop.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./"><img src="assets/logo.svg" alt="">Stride <span>Workshop</span></a>
      <nav>
        <a href="workshop.html" aria-current="page">Browse</a>
        <a href="publish.html">Publish</a>
        <a class="optional" href="docs.html">Docs</a>
      </nav>
      <button class="icon-btn" id="theme" aria-label="Switch light or dark"></button>
    </div>
  </header>

  <main class="wrap" id="catalog">
    <div class="intro">
      <h1>Workshop</h1>
      <p>Extensions for Stride. Each one is read and approved by hand before it appears here. Install them from the Extensions panel in the app, or from this page.</p>
    </div>
    <div class="filters">
      <label class="field">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="q" type="search" placeholder="Search" aria-label="Search extensions" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Category"></div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>

  <main class="wrap" id="detail" hidden></main>

  <footer class="foot">
    <div class="wrap">
      <span>Stride Workshop</span>
      <a href="./">Stride</a>
      <a href="docs.html">Make an extension</a>
      <a href="https://github.com/cleveroze/What/tree/HEAD/extensions">Source</a>
    </div>
  </footer>

  <script type="module">
    import { PERMISSIONS } from "./assets/workshop-core.js";
    import { DOWNLOAD_URL, codeViewer, contributions, esc, glyph, hueOf, morph, toast } from "./assets/workshop-ui.js";

    const grid = document.getElementById("grid");
    const chips = document.getElementById("chips");
    const q = document.getElementById("q");
    const catalog = document.getElementById("catalog");
    const detail = document.getElementById("detail");
    let all = [];
    let category = "All";
    const bundles = new Map();

    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
    function adds(e) {
      const s = e.summary ?? { commands: [], themes: [], snippets: [] };
      return [s.themes.length && plural(s.themes.length, "theme"), s.snippets.length && plural(s.snippets.length, "snippet"), s.commands.length && plural(s.commands.length, "command")]
        .filter(Boolean)
        .join(", ");
    }

    const tile = (e, i) => `<a class="tile" href="#${esc(e.id)}" style="--i:${Math.min(i, 14)};--h:${hueOf(e)}">
        ${glyph(e, 52)}
        <h3>${esc(e.name)}</h3>
        <p>${esc(e.description)}</p>
        <footer><span>${esc(adds(e))}</span><span>${e.builtin ? "Built in" : "@" + esc(e.publisher ?? "")}</span></footer>
      </a>`;

    function renderList() {
      const needle = q.value.trim().toLowerCase();
      const list = all.filter(
        (e) =>
          (category === "All" || (e.categories ?? []).includes(category)) &&
          (!needle || `${e.name} ${e.description} ${e.author} ${e.publisher}`.toLowerCase().includes(needle)),
      );
      grid.innerHTML = list.length ? list.map(tile).join("") : `<div class="empty">Nothing found.</div>`;
    }

    function renderChips() {
      const cats = ["All", ...new Set(all.flatMap((e) => e.categories ?? []))];
      chips.innerHTML = cats.map((c) => `<button class="chip" aria-pressed="${c === category}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    }

    function bundleOf(e) {
      if (!bundles.has(e.id)) bundles.set(e.id, fetch(`workshop/${e.bundle}`).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status)))));
      return bundles.get(e.id);
    }

    async function showDetail(id) {
      const e = all.find((x) => x.id === id);
      if (!e) return showCatalog();
      catalog.hidden = true;
      detail.hidden = false;
      document.title = `${e.name} · Stride Workshop`;
      const perms = e.permissions ?? [];
      detail.innerHTML = `
        <a class="back" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>All extensions</a>
        <div class="hero">
          <span id="hero-glyph">${glyph(e, 104)}</span>
          <div>
            <h1>${esc(e.name)}</h1>
            <div class="by">${e.builtin ? "Built into Stride" : `${esc(e.author)} · <a href="https://github.com/${esc(e.publisher)}">@${esc(e.publisher)}</a>`}</div>
          </div>
          <div class="actions">
            <a class="btn primary" href="stride://${e.builtin ? "extension" : "install"}/${esc(e.id)}" id="open-app">${e.builtin ? "Show in Stride" : "Install in Stride"}</a>
            <a class="btn quiet" href="workshop/${esc(e.bundle)}" download="${esc(e.id)}.stride-ext.json">Download</a>
          </div>
        </div>
        <div class="layout">
          <div>
            <p class="lead">${esc(e.description)}</p>
            <section class="block" id="adds"><h2>What it adds</h2><div class="rows"><div><span class="grow note">Loading…</span></div></div></section>
            <section class="block" id="files" hidden><h2>Source</h2></section>
          </div>
          <aside class="side">
            <dl class="facts">
              <div><dt>Version</dt><dd>${esc(e.version)}</dd></div>
              <div><dt>Category</dt><dd>${esc((e.categories ?? []).join(", ") || "—")}</dd></div>
              <div><dt>Publisher</dt><dd>${e.builtin ? "Stride" : "@" + esc(e.publisher)}</dd></div>
              <div><dt>Review</dt><dd>Approved by @cleveroze</dd></div>
            </dl>
            ${
              perms.length
                ? perms.map((p) => `<div class="perm"><b>${esc(p)}</b>${esc(PERMISSIONS[p] ?? "")}</div>`).join("")
                : `<div class="perm"><b>No permissions</b>Runs in a sandbox without internet or file access.</div>`
            }
            <p class="note">Install does nothing? <a href="${DOWNLOAD_URL}">Get Stride</a>, or install the downloaded file from Extensions → ⋯ → Install from file.</p>
          </aside>
        </div>`;
      const heroGlyph = detail.querySelector("#hero-glyph .glyph");
      morph(heroGlyph, [e.icon || "cookie9", "softBurst", "clover4", "pentagon", "flower"]);
      scrollTo({ top: 0 });
      try {
        const b = await bundleOf(e);
        if (decodeURIComponent(location.hash.slice(1)) !== id) return;
        heroGlyph.style.setProperty("--h", hueOf(e, b.manifest));
        detail.querySelector("#adds .rows").innerHTML = contributions(b.manifest) || `<div><span class="grow note">Nothing listed.</span></div>`;
        const files = detail.querySelector("#files");
        files.append(codeViewer({ ...b.files, "extension.json": JSON.stringify(b.manifest, null, 2) }));
        files.hidden = false;
      } catch {
        detail.querySelector("#adds .rows").innerHTML = `<div><span class="grow note">Could not load the details.</span></div>`;
      }
    }

    function showCatalog() {
      detail.hidden = true;
      catalog.hidden = false;
      document.title = "Workshop · Stride";
      renderList();
    }

    const route = () => (location.hash.length > 1 ? showDetail(decodeURIComponent(location.hash.slice(1))) : showCatalog());
    addEventListener("hashchange", () => (document.startViewTransition ? document.startViewTransition(route) : route()));
    chips.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-cat]");
      if (!b) return;
      category = b.dataset.cat;
      renderChips();
      renderList();
    });
    q.addEventListener("input", renderList);
    detail.addEventListener("click", (ev) => {
      if (ev.target.closest("#open-app")) toast("Opening Stride…");
    });

    try {
      const res = await fetch("workshop/registry.json", { cache: "no-cache" });
      all = (await res.json()).extensions.sort((a, b) => Number(a.builtin) - Number(b.builtin) || a.name.localeCompare(b.name));
      renderChips();
      route();
    } catch {
      grid.innerHTML = `<div class="empty">The catalog did not load. Refresh the page to try again.</div>`;
    }
  </script>
</body>
</html>
