name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install WebKitGTK (Linux build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: stride-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/stride.exe
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName release/Stride-Setup.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName release/Stride.msi
          Copy-Item src-tauri/target/release/stride.exe release/Stride-Portable.exe
          if ($env:GITHUB_REF_NAME -eq "fix/ai-assistant-text-overlap") {
            $fixTag = "stride-ai-fix-v3"
            $fixTitle = "Stride UI Alignment Fix v3 (preview)"
            $fixNotes = "Fixes Expressive activity icon alignment and AI Assistant text wrapping. Built from commit $env:GITHUB_SHA."
            gh release view $fixTag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $fixTag release/Stride-Setup.exe release/Stride.msi release/Stride-Portable.exe --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release edit $fixTag --title $fixTitle --notes $fixNotes --target $env:GITHUB_SHA
            } else {
              gh release create $fixTag release/Stride-Setup.exe release/Stride.msi release/Stride-Portable.exe --title $fixTitle --notes $fixNotes --target $env:GITHUB_SHA --prerelease
            }
            exit $LASTEXITCODE
          }
          # Replace the rolling "latest build" release with this build.
          gh release delete stride-latest --yes --cleanup-tag 2>$null
          $notes = "Latest build of Stride for Windows 10/11.`n`n" +
            "- **Stride-Setup.exe** - installer (recommended, no admin rights needed)`n" +
            "- **Stride.msi** - MSI installer`n" +
            "- **Stride-Portable.exe** - run without installing`n`n" +
            "Windows may show 'Windows protected your PC' because the app is not code-signed: click More info -> Run anyway.`n`n" +
            "Built from commit $env:GITHUB_SHA."
          gh release create stride-latest release/Stride-Setup.exe release/Stride.msi release/Stride-Portable.exe `
            --title "Stride (latest build)" --notes $notes --target $env:GITHUB_SHA --latest
